name: 24/7 Minecraft Cloud AFK Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: minecraft-cloud-afk-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd afk-bot
          npm install

      - name: Run 24/7 Cloud AFK Bot
        run: |
          cd afk-bot
          node run_local.js
